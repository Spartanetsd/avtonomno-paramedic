<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Автономно</title>
<meta name="description" content="Практичні й безпечні рішення, коли немає світла, газу, опалення, води чи зв’язку, і під час повітряної тривоги. Працює без інтернету.">
<meta name="theme-color" content="#F8F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1424" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Автономно">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<a class="skip" href="#main">Перейти до вмісту</a>

<header class="top">
  <a class="brand" href="#/" aria-label="Автономно — на головну">
    <svg class="brand-mark" aria-hidden="true"><use href="#logo"></use></svg>
    <span>АВТОНОМНО</span>
  </a>
  <a class="sh-chip" id="sh-chip" href="#/shelter" aria-label="Режим укриття" hidden></a>
  <a class="top-btn" href="#/safety" aria-label="Безпека та екстрені номери">
    <svg class="ic" aria-hidden="true"><use href="#i-shield"></use></svg><span>Безпека</span>
  </a>
</header>

<main id="main" tabindex="-1">
  <div class="boot">
    <p class="greet">Завантаження…</p>
    <noscript><p>Для роботи застосунку потрібен JavaScript. Увімкніть його в налаштуваннях браузера.</p></noscript>
  </div>
</main>

<nav class="tabbar" aria-label="Основна навігація">
  <a href="#/" data-tab="home"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg><span>Рішення</span></a>
  <a href="#/shelter" data-tab="shelter"><svg class="ic" aria-hidden="true"><use href="#i-shelter"></use></svg><span>Укриття</span></a>
  <a href="#/res" data-tab="res"><svg class="ic" aria-hidden="true"><use href="#i-list"></use></svg><span>Готовність</span></a>
  <a href="#/calc" data-tab="calc"><svg class="ic" aria-hidden="true"><use href="#i-calc"></use></svg><span>Розрахунки</span></a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  // Якщо модулі не запустилися (дуже старий браузер) — чесно повідомити.
  setTimeout(function () {
    if (!window.__avReady) {
      var m = document.getElementById('main');
      if (m) m.innerHTML = '<div class="boot"><h1>Не вдалося запустити застосунок</h1><p>Оновіть браузер (Safari, Chrome, Firefox останніх версій) і відкрийте сторінку ще раз.</p></div>';
    }
  }, 8000);
</script>
